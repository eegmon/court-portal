services:
  - type: web
    name: court-portal
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: COURT_JWT_SECRET
        sync: false
      - key: COURT_BOOTSTRAP_SECRET
        sync: false
